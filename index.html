<script>const STATION_DATA={"ru": [{"id": 1, "tag": "Символы", "title": "AI — Мир государственных символов", "intro": "Проверьте внимательность: даже уверенный ответ искусственного интеллекта может оказаться ошибкой.", "icon": "◈", "color": "gold", "tasks": [["Блиц", "Назовите три государственных символа Казахстана. Какие птица и небесное светило изображены на флаге?"], ["Разберите символ", "Какой элемент находится в центре герба? Объясните его значение своими словами."], ["30 секунд", "Объясните гостю страны, почему государственные символы — больше, чем просто изображения и музыка."], ["Ошибся ли ИИ?", "Учебная вымышленная фраза ИИ: «На флаге Казахстана орнамент расположен справа, а над солнцем летит орёл». Найдите две ошибки. Назовите источник, по которому проверите ответ."], ["Творчество с ИИ", "Составьте запрос к ИИ: объяснить смысл государственных символов школьникам за 30 секунд. Получите ответ, проверьте его и представьте свою улучшенную версию. Не изменяйте сами государственные символы."]]}, {"id": 2, "tag": "История", "title": "История говорит", "intro": "Ваш стол превратился в архив. Сопоставляйте улики, проверяйте даты и отделяйте событие от его интерпретации.", "icon": "⌛", "color": "blue", "tasks": [["След пропавшего хана", "Два султана ушли из ханства Абулхаира в Могулистан. Их имена — Керей и Жанибек. Сведения об образовании нового ханства есть в «Тарих-и Рашиди». Назовите событие и приблизительную дату."], ["Ошибка в машине времени", "Восстановите порядок: образование Казахской АССР; восстание 1916 года; создание партии «Алаш»; революции 1917 года. Уточните: Февральская революция, создание партии, Октябрьская революция — в какой последовательности?"], ["Две правды в архиве", "Чем отличаются декабрьские события 1986 года и провозглашение независимости в 1991 году? Назовите два вида источников, которые помогут исследовать декабрьские события."], ["Проверка каталога", "В учебной ошибочной записи сказано: «Автономия Алаш впервые провозглашена в 1920 году». Исправьте дату и объясните, с каким событием её перепутали."], ["Творчество с ИИ", "Попросите ИИ составить музейную подпись об образовании Казахского ханства — не более 40 слов. Проверьте имена и дату; представьте подпись и расскажите, что вы проверили."]]}, {"id": 3, "tag": "Наследие", "title": "Национальное наследие — сокровище народа", "intro": "Соедините живые традиции и современные идеи. Главное — сохранить смысл, а не только красивый узор.", "icon": "♧", "color": "green", "tasks": [["Музыка степи", "Назовите казахский струнный щипковый инструмент с двумя струнами. Вспомните название одного кюя или имя кюйши. Если ведущий подготовил запись, попробуйте узнать её."], ["Узнайте традицию", "На празднике перед ребёнком, который начинает ходить, перерезают путы. Назовите обряд и объясните, какое пожелание он выражает."], ["Игра поколений", "Выберите одну казахскую национальную игру. Объясните её цель, участников и хотя бы одно правило так, чтобы остальные могли начать играть."], ["Музей без этикеток", "У вас три карточки: «домбра», «тұсаукесер», «тоғызқұмалақ». Соотнесите их с категориями «музыка», «обряд», «игра». Придумайте одну общую тему для музейного стенда."], ["Творчество с ИИ", "С помощью ИИ придумайте современный предмет с национальным орнаментом ИЛИ рекламу одной традиции на 30 секунд. Объясните, как вы сохранили культурный смысл и что проверили в ответе ИИ."]]}, {"id": 4, "tag": "Родной край", "title": "Мой Казахстан", "intro": "Станьте проводниками по родному краю: от знакомого места до маршрута, который захочется пройти.", "icon": "⌁", "color": "rose", "tasks": [["Узнайте место", "Назовите город Казахстана, с которым связан монумент «Байтерек». Назовите ещё одну достопримечательность страны и город или регион, где она находится."], ["Маршрут домой", "Выберите природный или исторический объект рядом с Есиком. Объясните, где он расположен и как вы описали бы дорогу гостю. При наличии карты покажите его."], ["Три необычных слова", "Опишите родной край тремя небанальными словами. Объясните каждое через конкретное место, впечатление или местную особенность."], ["Редактор путеводителя", "ИИ предложил маршрут по трём местам, но не указал расстояния и время в пути. Что нужно проверить до публикации? Назовите минимум три проверки и подходящий источник информации."], ["Творчество с ИИ", "За одну минуту подготовьте с помощью ИИ туристическую рекламу Казахстана будущего. Включите одно реальное место, одну идею будущего и одну меру заботы о природе. Явно отделите факт от фантазии."]]}, {"id": 5, "tag": "Будущее", "title": "Казахстан будущего — 2050", "intro": "Технологии имеют смысл, когда помогают людям. Превратите смелую идею в понятный первый шаг.", "icon": "✳", "color": "violet", "tasks": [["Выберите направление", "Образование, экология, цифровизация или национальная культура: выберите одно направление и сформулируйте конкретную проблему, которую хотите решить."], ["Три идеи", "С помощью ИИ предложите три разных решения. Для каждого назовите, кому оно поможет. Если ИИ недоступен, проведите командный мозговой штурм."], ["От идеи к действию", "Выберите одно решение. Назовите первый шаг, необходимые ресурсы и измеримый признак успеха."], ["Проверка на реальность", "ИИ обещает реализовать проект «без затрат, без рисков и за один день». Какие допущения вы проверите? Назовите два риска и способ уменьшить каждый из них."], ["Письмо в будущее", "Напишите с помощью ИИ обращение от жителей Казахстана 2050 года к нынешнему поколению — до 60 слов. Сохраните национальные ценности и добавьте одно конкретное действие, которое можно начать сегодня."]]}], "kk": [{"id": 1, "tag": "Рәміздер", "title": "AI — Мемлекеттік рәміздер әлемі", "intro": "Зейініңізді сынап көріңіз: жасанды интеллект сенімді жауап берсе де, қателесуі мүмкін.", "icon": "◈", "color": "gold", "tasks": [["Блиц", "Қазақстанның үш мемлекеттік рәмізін атаңыз. Туда қандай құс пен аспан денесі бейнеленген?"], ["Рәміздің мәні", "Елтаңбаның ортасында қандай белгі орналасқан? Он ламас бұрын нені тексеру керек? Кемінде үш тексеруді және тиісті ақпарат көзін атаңыздар."], ["ЖИ-мен шығармашылық", "Бір минут ішінде ЖИ көмегімен болашақ Қазақстанға арналған туристік жарнама дайындаңыздар. Бір нақты нысанды, болашақтың бір идеясын және табиғатты қорғаудың бір шарасын қосыңыздар. Дерек пен қиялды анық ажыратыңыздар."]]}, {"id": 5, "tag": "Болашақ", "title": "Болашақ Қазақстан — 2050", "intro": "Технологияның мәні — адамға пайда әкелуінде. Батыл идеяны нақты алғашқы қадамға айналдырыңыздар.", "icon": "✳", "color": "violet", "tasks": [["Бағытты таңдаңыздар", "Білім беру, экология, цифрландыру немесе ұлттық мәдениет: бір бағытты таңдап, шешкілеріңіз келетін нақты мәселені тұжырымдаңыздар."], ["Үш идея", "ЖИ көмегімен үш түрлі шешім ұсыныңыздар. Әрқайсысының кімге көмектесетінін айтыңыздар. ЖИ қолжетімсіз болса, топпен ой бөлісіңіздер."], ["Идеядан іске", "Бір шешімді таңдаңыздар. Алғашқы қадамды, қажетті ресурстарды және табысты өлшеуге болатын көрсеткішті атаңыздар."], ["Шынайылығын тексеру", "ЖИ жобаны «шығынсыз, тәуекелсіз және бір күнде» жүзеге асыруға уәде береді. Қандай болжамдарды тексересіздер? Екі тәуекелді және әрқайсысын азайтудың бір жолын атаңыздар."], ["Болашақтан хат", "ЖИ көмегімен 2050 жылғы Қазақстан тұрғындарының атынан бүгінгі ұрпаққа 60 сөзден аспайтын үндеу жазыңыздар. Ұлттық құндылықтарды сақтап, бүгіннен бастауға болатын бір нақты әрекетті қосыңыздар."]]}]};

'use strict';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang='ru',started=false,currentView='home',selectedStation=1,viewCleanup=()=>{};
const state={teams:[1,2,3].map(n=>({id:'team'+n,name:'',n})),scores:{},updated:null};
const drafts={},timers={};
function t(key,args={}){const pair=UI[key];if(!pair)throw Error('Missing translation: '+key);return pair[lang==='kk'?1:0].replace(/\{(\w+)\}/g,(_,k)=>String(args[k]??''));}
function teamName(team){return team.name||t('defaultTeam',{n:team.n});}
function readState(){return {...JSON.parse(JSON.stringify(state)),teams:state.teams.map(team=>({...team,name:teamName(team)}))};}
function stationData(){return STATION_DATA[lang];}
function criteriaFor(id){return id===6?[[t('final'),10]]:[[t('cKnowledge'),5],[t('cCreative'),5],[t('cTeam'),3],[t('cEvidence'),2]];}
window.addEventListener('beforeunload',e=>{if(started){e.preventDefault();e.returnValue=true;}});
function applyChrome(){
 document.documentElement.lang=lang;
 document.title='AI QAZAQSTAN — '+t('brand');
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
 $('#primary-nav').setAttribute('aria-label',t('menu'));
 $('#grading').setAttribute('aria-label',t('gradingTitle'));
 $('#grade-station').innerHTML=stationData().map(s=>`<option value="${s.id}">${s.id}. ${s.title}</option>`).join('')+`<option value="6">${t('final')}</option>`;
 $('#grade-station').value=String(selectedStation);
 document.querySelectorAll('[data-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===lang)));
}
function chooseLanguage(next){
 if(next!=='ru'&&next!=='kk')return;
 const visible=started&&!$('#grading').hidden,editor=started&&!$('#team-editor').hidden;
 if(visible)rememberGrades();
 const inputs=editor?state.teams.map(team=>$('#name-'+team.id).value):null;
 const scroll=window.scrollY;
 lang=next;started=true;$('#language-gate').hidden=true;$('#app').hidden=false;applyChrome();
 render(currentView,false);
 if(visible)openGrading(selectedStation,false);
 if(editor){openNames(false);inputs.forEach((name,i)=>$('#name-'+state.teams[i].id).value=name);}
 window.scrollTo(0,scroll||0);
}
function rubric(){return '<div class="rubric">'+criteriaFor(1).map(c=>`<div><b>${c[1]}</b>${c[0]}</div>`).join('')+'</div>';}

 $('#main').innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">${t('date')}</div><h1>${t('hero1')}<br>${t('hero2')} <em>${t('hero3')}</em></h1><p>${t('heroText')}</p><div class="actions"><a class="btn gold" href="#stations">${t('start')}</a><a class="btn secondary" href="#board">${t('board')}</a></div></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="sun">✳</div><span class="orbit-label ol1">${t('heritage')}</span><span class="orbit-label ol2">${t('knowledge')}</span><span class="orbit-label ol3">${t('future')}</span></div></section><section class="stats"><div class="stat"><b>05</b><span>${t('statStations')}</span></div><div class="stat"><b>80</b><span>${t('statTime')}</span></div><div class="stat"><b>85</b><span>${t('statMax')}</span></div></section><section id="stations"><div class="section-head"><div><div class="eyebrow">${t('route')}</div><h2>${t('routeTitle')}</h2></div><p>${t('routeText')}</p></div><div class="grid">${stationData().map(s=>`<a class="card" href="#station-${s.id}"><div class="card-top"><span class="icon ${s.color}">${s.icon}</span><span class="number">${t('station')} 0${s.id}</span></div><h3>${s.title}</h3><p>${s.intro}</p><div class="card-bottom"><span>${t('cardTime')}</span><span>↗</span></div></a>`).join('')}<a class="card final-card" href="#final"><div class="card-top"><span class="icon">✧</span><span class="number">${t('finalTag')}</span></div><h3>${t('finalTitle')}</h3><p>${t('finalIntro')}</p><div class="card-bottom"><span>${t('finalPoints')}</span><span>↗</span></div></a></div></section><div class="note"><b>${t('how')}</b><p>${t('howText')}</p><p>${t('noAI')}</p></div>`;
}
function timerMarkup(){return `<div class="timer"><div><small>${t('timer')}</small><output id="clock" aria-label="${t('remaining')}">08:00</output></div><div><button type="button" id="toggle-timer">${t('timerStart')}</button> <button type="button" id="reset-timer">${t('reset')}</button></div></div>`;}
function startTimer(id){
 const clock=timers[id]||(timers[id]={remaining:480,running:false,end:0,begun:false});
 function draw(){const seconds=clock.running?Math.max(0,Math.ceil((clock.end-Date.now())/1000)):clock.remaining;if(seconds===0){clock.remaining=0;clock.running=false;}$('#clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');$('#toggle-timer').textContent=t(seconds===0?'expired':clock.running?'pause':clock.begun?'resume':'timerStart');}
 $('#toggle-timer').onclick=()=>{if(clock.running){clock.remaining=Math.max(0,Math.ceil((clock.end-Date.now())/1000));clock.running=false;}else if(clock.remaining>0){clock.running=true;clock.begun=true;clock.end=Date.now()+clock.remaining*1000;}draw();};
 $('#reset-timer').onclick=()=>{clock.remaining=480;clock.running=false;clock.begun=false;draw();};draw();const interval=setInterval(draw,250);viewCleanup=()=>clearInterval(interval);
}
function stationNavigation(id){return `<div class="station-steps" role="navigation" aria-label="${t('navStations')}"><button type="button" class="step-button step-back" data-navigate="${id===1?'home':'station-'+(id-1)}">${id===1?t('allStations'):t('back')}</button><span>${t('station')} ${id} / 5</span><button type="button" class="step-button step-next" data-navigate="${id===5?'final':'station-'+(id+1)}">${id===5?t('forwardFinal'):t('forwardStation',{n:id+1})}</button></div>`;}
const CODE_LETTERS=['Б','І','Л','І','М'];
function earnedLetters(team){return CODE_LETTERS.map((letter,i)=>state.scores[team+'_'+(i+1)]?letter:null);}
function letterMarkup(team,station){
 if(station===6)return '';
 const earned=!!state.scores[team+'_'+station];
 return earned?`<div class="earned-letter"><span>${t('earnedLetter',{n:station})}</span><b>${CODE_LETTERS[station-1]}</b><small>${t('letterHint')}</small></div>`:`<p class="fine">${t('letterLocked')}</p>`;
}
function finalCodesMarkup(){return `<section class="final-code-panel"><h2>${t('collectedCodes')}</h2><p>${t('codeProgressHint')}</p>${state.teams.map(team=>{const letters=earnedLetters(team.id),count=letters.filter(Boolean).length;return `<article class="code-team"><div class="section-head"><h3>${esc(teamName(team))}</h3><span class="pill">${t('codeCount',{n:count})}</span></div><div class="code-slots">${letters.map((letter,i)=>`<div class="code-slot ${letter?'earned':'locked'}"><small>${t('station')} ${i+1}</small><b aria-label="${esc(letter||t('notGraded'))}">${letter||'—'}</b></div>`).join('')}</div><p class="${count===5?'success':'fine'}">${count===5?t('codeComplete'):t('codeIncomplete')}</p></article>`;}).join('')}</section>`;}

function station(id){
 const s=stationData().find(x=>x.id===id);if(!s)return home();
 $('#main').innerHTML=`<a class="back" href="#home">${t('allStations')}</a><div class="station-heading"><div><div class="eyebrow">${t('station')} 0${id} / 05 · ${s.tag}</div><h1>${s.title}</h1><p>${s.intro}</p><span class="pill">${t('oral')}</span></div>${timerMarkup()}</div><section aria-label="${t('tasks')}">${s.tasks.map((task,i)=>`<article class="task ${i===4?'creative':''}"><span class="task-num">${i+1}</span><div><h3>${task[0]}</h3><p>${task[1]}</p>${i===4?'<small>'+t('noAIShort')+'</small>':''}</div></article>`).join('')}</section>${stationNavigation(id)}<div class="note"><b>${t('rubricTitle')}</b>${rubric()}<p>${t('rubricNote')}</p></div><div class="actions"><button class="btn gold" type="button" data-score-station="${id}">${t('grade')}</button><button class="btn secondary" id="print" type="button">${t('print')}</button></div>`;
 $('#print').onclick=()=>window.print();startTimer(id);
}
function finalPage(){
 $('#main').innerHTML=`<a class="back" href="#home">${t('allStations')}</a><div class="eyebrow">${t('finalEyebrow')}</div><h1>${t('finalHeading')}</h1><p>${t('finalLead')}</p><div id="final-codes">${finalCodesMarkup()}</div><article class="task"><span class="task-num">1</span><div><h3>${t('codeTitle')}</h3><p>${t('codeText')}</p></div></article><article class="task"><span class="task-num">2</span><div><h3>${t('pitchTitle')}</h3><p>${t('pitchText')}</p></div></article><div class="station-steps" role="navigation" aria-label="${t('navStations')}"><button type="button" class="step-button step-back" data-navigate="station-5">${t('toStation5')}</button><button type="button" class="step-button step-next" data-navigate="board">${t('seeBoard')}</button></div><div class="note"><b>${t('finalRubricTitle')}</b><p>${t('finalRubric')}</p></div><button class="btn gold" type="button" data-score-station="6">${t('gradeFinal')}</button>`;
}
function totals(d){return d.teams.map(team=>{const values=Array.from({length:6},(_,i)=>d.scores[team.id+'_'+(i+1)]);return {...team,values,total:values.reduce((a,v)=>a+(v?.total||0),0),done:values.filter(Boolean).length};}).sort((a,b)=>b.total-a.total||a.n-b.n);}
function boardMarkup(d){
 const list=totals(d),empty=!list.some(team=>team.done),max=list[0]?.total,leaders=list.filter(team=>team.total===max).map(team=>team.name),done=list.reduce((a,team)=>a+team.done,0);let last=-1,rank=0;
 return `<div class="leader"><div class="panel"><div class="eyebrow">${t(empty?'startBoard':leaders.length>1?'leaders':'leader')}</div><h2>${empty?t('firstPoints'):esc(leaders.join(' · '))}</h2><span class="board-num">${empty?'—':max}</span> / 85</div><div class="panel" style="background:white;color:var(--ink)"><h3>${t('contribution')}</h3><p style="color:var(--muted)">${t('boardNote')}</p><div class="progress"><i style="width:${done/18*100}%"></i></div><span class="fine">${t('filled',{done,all:18})}</span></div></div><div class="table-wrap"><table><caption class="sr-only">${t('tableCaption')}</caption><thead><tr><th>${t('rank')}</th><th>${t('team')}</th>${[1,2,3,4,5].map(i=>`<th>${lang==='kk'?'Б':'С'}${i} / 15</th>`).join('')}<th>${t('final')} / 10</th><th>${t('total')} / 85</th></tr></thead><tbody>${list.map((team,i)=>{if(team.total!==last){rank=i+1;last=team.total;}return `<tr><td>${empty?'—':rank}</td><td><b>${esc(team.name)}</b></td>${team.values.map(v=>`<td>${v?v.total:'—'}</td>`).join('')}<td class="total">${team.total}</td></tr>`;}).join('')}</tbody></table></div><p class="fine">${t('emptyNote')} ${d.updated?esc(t('lastUpdate',{time:new Date(d.updated).toLocaleString(lang==='kk'?'kk-KZ':'ru-RU')})):''}</p>`;
}
function board(){$('#main').innerHTML=`<div class="section-head"><div><div class="eyebrow">${t('boardEyebrow')}</div><h1 style="font-size:42px">${t('board')}</h1></div><button type="button" class="btn secondary" data-open-names>${t('teams')}</button></div>`+boardMarkup(readState());}
function jury(){$('#main').innerHTML=`<div class="eyebrow">${t('jury')}</div><h1 style="font-size:38px">${t('gradingTitle')}</h1><p>${t('gradingIntro')}</p>`;openGrading(selectedStation,false);}
function saveGrade(team){
 const station=Number($('#grade-station').value),fields=criteriaFor(station),inputs=fields.map((_,i)=>$('#grade-'+team+'-'+i)),values=inputs.map(el=>el.value.trim()===''?NaN:Number(el.value)),feedback=$('#feedback-'+team);
 if(values.some((v,i)=>!Number.isInteger(v)||v<0||v>fields[i][1])){feedback.textContent=t('invalidScore',{ranges:fields.map(f=>'0–'+f[1]).join(', ')});feedback.className='status error';return false;}
 const key=team+'_'+station,now=new Date().toISOString(),record={values,total:values.reduce((a,b)=>a+b,0),revision:(state.scores[key]?.revision||0)+1,time:now};
 state.scores[key]=record;state.updated=now;delete drafts[key];feedback.textContent=t('savedScore',{total:record.total,max:station===6?10:15});feedback.className='status success';$('#saved-'+team).textContent=t('inTable',{total:record.total,max:station===6?10:15});$('#live-results').innerHTML=boardMarkup(readState());$('#letter-'+team).innerHTML=letterMarkup(team,station);if($('#final-codes'))$('#final-codes').innerHTML=finalCodesMarkup();return true;
}
function saveAllGrades(){const saved=state.teams.filter(team=>saveGrade(team.id)).length;$('#save-all-status').textContent=saved===3?t('allSaved'):t('partSaved',{n:saved});$('#save-all-status').className='status '+(saved===3?'success':'error');return saved;}
function rememberGrades(){const st=Number($('#grade-station').value);state.teams.forEach(team=>{const inputs=criteriaFor(st).map((_,i)=>$('#grade-'+team.id+'-'+i));if(inputs.every(Boolean))drafts[team.id+'_'+st]={values:inputs.map(x=>x.value)};});}
function renderGrades(station){
 selectedStation=station;$('#grade-station').value=String(station);const fields=criteriaFor(station);
 $('#grading-rows').innerHTML=state.teams.map(team=>{const key=team.id+'_'+station,record=state.scores[key],values=drafts[key]?.values||record?.values||fields.map(()=>0);return `<article class="grade-card"><div class="section-head"><h3>${esc(teamName(team))}</h3><b id="saved-${team.id}" class="pill">${record?t('inTable',{total:record.total,max:station===6?10:15}):t('notGraded')}</b></div><div class="score-fields">${fields.map((field,i)=>`<label>${field[0]}<input id="grade-${team.id}-${i}" class="grade-value" data-grade-team="${team.id}" inputmode="numeric" type="number" min="0" max="${field[1]}" step="1" value="${esc(values[i])}" aria-label="${esc(teamName(team))}: ${field[0]}"><span>${t('range',{max:field[1]})}</span></label>`).join('')}</div><button type="button" class="btn grade-save" data-save-team="${team.id}">${t('grade')} — ${esc(teamName(team))}</button><p id="feedback-${team.id}" class="status" role="status"></p><div id="letter-${team.id}" aria-live="polite">${letterMarkup(team.id,station)}</div></article>`;}).join('');
 $('#live-results').innerHTML=boardMarkup(readState());$('#save-all-status').textContent=t('autoNote');
}
function openGrading(station,scroll=true){$('#grading').hidden=false;renderGrades(station);if(scroll)$('#grading').scrollIntoView({behavior:'smooth',block:'start'});}
function openNames(scroll=true){
 $('#team-editor').hidden=false;
 $('#name-fields').innerHTML=state.teams.map(team=>`<label>${t('namesLabel',{n:team.n})}<input id="name-${team.id}" type="text" maxlength="40" value="${esc(teamName(team))}" autocomplete="off"></label>`).join('');
 $('#names-status').textContent='';if(scroll){$('#team-editor').scrollIntoView({behavior:'smooth',block:'start'});$('#name-team1').focus({preventScroll:true});}
}
function saveNames(){
 const names=state.teams.map(team=>$('#name-'+team.id).value.trim());
 if(names.some(name=>!name||name.length>40)||new Set(names.map(name=>name.toLocaleLowerCase())).size!==3){$('#names-status').textContent=t('namesError');$('#names-status').className='status error';return false;}
 const gradingVisible=!$('#grading').hidden;if(gradingVisible)rememberGrades();
 state.teams.forEach((team,i)=>team.name=names[i]);render(currentView,false);if(gradingVisible)openGrading(selectedStation,false);
 $('#names-status').textContent=t('namesSaved');$('#names-status').className='status success';return true;
}
function csvText(){
 const quote=value=>'"'+String(value??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';
 const rows=[[t('team'),...Array.from({length:5},(_,i)=>t('station')+' '+(i+1)),t('final'),t('total')],...totals(readState()).map(team=>[team.name,...team.values.map(v=>v?.total??''),team.total])];
 return '\ufeff'+rows.map(row=>row.map(quote).join(';')).join('\r\n');
}
function exportResults(){const url=URL.createObjectURL(new Blob([csvText()],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='AI-QAZAQSTAN-'+lang+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function render(view,scroll=true){
 if(!started)return;if(!$('#grading').hidden)rememberGrades();$('#grading').hidden=true;viewCleanup();viewCleanup=()=>{};
 currentView=/^(home|stations|jury|board|final|station-[1-5])$/.test(view)?view:'home';
 document.querySelectorAll('#primary-nav a').forEach(a=>{if(a.getAttribute('href')==='#'+currentView)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
 if(currentView==='jury')jury();else if(currentView==='board')board();else if(currentView==='final')finalPage();else if(currentView.startsWith('station-'))station(Number(currentView.split('-')[1]));else home();
 if(scroll){if(currentView==='stations')$('#stations').scrollIntoView({behavior:'smooth'});else window.scrollTo(0,0);}
}
function navigate(view){render(view);}
document.addEventListener('click',event=>{
 const move=event.target.closest('[data-navigate]');if(move){event.preventDefault();navigate(move.dataset.navigate);return;}
 const language=event.target.closest('[data-lang]');if(language){event.preventDefault();chooseLanguage(language.dataset.lang);return;}
 const names=event.target.closest('[data-open-names]');if(names){event.preventDefault();openNames();return;}
 const score=event.target.closest('[data-score-station]');if(score){event.preventDefault();openGrading(Number(score.dataset.scoreStation));return;}
 const save=event.target.closest('[data-save-team]');if(save){event.preventDefault();saveGrade(save.dataset.saveTeam);return;}
 const link=event.target.closest('a[href^="#"]');if(!link)return;const view=link.getAttribute('href').slice(1);if(!/^(home|stations|jury|board|final|station-[1-5])$/.test(view))return;event.preventDefault();navigate(view);
});
document.addEventListener('input',event=>{if(event.target.classList.contains('grade-value')){rememberGrades();saveGrade(event.target.dataset.gradeTeam);}});
$('#grade-station').addEventListener('change',()=>renderGrades(Number($('#grade-station').value)));
$('#save-all-top').addEventListener('click',saveAllGrades);$('#save-all-bottom').addEventListener('click',saveAllGrades);$('#export-results').addEventListener('click',exportResults);
$('#save-names').addEventListener('click',saveNames);$('#close-names').addEventListener('click',()=>$('#team-editor').hidden=true);
window.addEventListener('hashchange',()=>{currentView=location.hash.slice(1)||'home';if(started)navigate(currentView);});
currentView=location.hash.slice(1)||'home';
</script></body></html>
